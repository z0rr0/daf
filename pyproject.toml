[project]
name = "daf"
version = "1.2.1"
description = "Django Audio Feed is a simple web application that allows to create custom RSS podcast feeds."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "markdown>=3.10.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [
    "daf/daf/local_settings.py",
    "daf/daf/settings.py",
    "daf/podcast/migrations",
]

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP", "W"]
