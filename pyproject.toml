[project]
name = "daf"
version = "1.2.4"
description = "Django Audio Feed is a simple web application that allows to create custom RSS podcast feeds."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
# Dependencies of the standalone CLI scripts in clients/, not of the Django app.
# Installed locally by default (see tool.uv.default-groups), excluded from the Docker image.
clients = [
    "markdown>=3.10.3",
    "requests>=2.34.2",
]

[tool.uv]
default-groups = ["dev", "clients"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [
    "daf/daf/local_settings.py",
    "daf/daf/settings.py",
    "daf/podcast/migrations",
]

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP", "W"]
