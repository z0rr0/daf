[project]
name = "daf"
version = "1.1.42"
description = "Django Audio Feed is a simple web application that allows to create custom RSS podcast feeds."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.8",
    "flake8>=7.3.0",
    "markdown>=3.10.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
]
